name: Release

# Publishes @near-intents-agent-api/sdk to npm. Push a tag `v<version>` matching package.json, or
# run manually (dry run by default). Uses npm trusted publishing (OIDC); there is no NPM_TOKEN.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and verify without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      - name: Resolve version and dist-tag
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - run: pnpm check

      - name: Publish ${{ steps.version.outputs.version }} (${{ steps.version.outputs.tag }})
        run: |
          args=(--access public --tag "${{ steps.version.outputs.tag }}")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if npm publish "${args[@]}"; then exit 0; fi
          [ "$DRY_RUN" = "true" ] && exit 1
          # The registry has answered a successful trusted publish with a spurious 401 (v0.5.0).
          # Count the release as done only when the version is live and built from this commit.
          name=$(node -p "require('./package.json').name")
          version="${{ steps.version.outputs.version }}"
          echo "::warning::npm publish reported an error; checking the registry for $name@$version"
          for _ in $(seq 1 12); do
            head=$(npm view "$name@$version" gitHead --prefer-online 2>/dev/null || true)
            if [ "$head" = "$GITHUB_SHA" ]; then
              echo "$name@$version is published from $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$name@$version is not on the registry from $GITHUB_SHA"
          exit 1
